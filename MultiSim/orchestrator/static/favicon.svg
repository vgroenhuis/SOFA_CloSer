<svg xmlns="http://www.w3.org/2000/svg" viewBox="12.2 11.2 47 47">
	<!-- A soft finger bending up from its clamp, drawn as FEM triangles
	     colored by strain (red at the clamped base, blue at the tip).
	     The viewBox is cropped to the drawing so it fills the icon. -->
	<g stroke="#10131c" stroke-width="1.3" stroke-linejoin="round">
		<polygon points="34,52 54,52 50.96,36.69" fill="#e5484d"/>
		<polygon points="34,52 50.96,36.69 32.48,44.35" fill="#c93c40"/>
		<polygon points="32.48,44.35 50.96,36.69 42.28,23.72" fill="#f5b324"/>
		<polygon points="32.48,44.35 42.28,23.72 28.14,37.86" fill="#dc9b12"/>
		<polygon points="28.14,37.86 42.28,23.72 29.31,15.04" fill="#3ecf6e"/>
		<polygon points="28.14,37.86 29.31,15.04 21.65,33.52" fill="#2fb35b"/>
		<polygon points="21.65,33.52 29.31,15.04 14,12" fill="#4a86f5"/>
		<polygon points="21.65,33.52 14,12 14,32" fill="#3568d6"/>
	</g>
	<!-- The clamp. -->
	<rect x="30" y="52" width="28" height="6" rx="1.5" fill="#8f97a3"/>
</svg>
