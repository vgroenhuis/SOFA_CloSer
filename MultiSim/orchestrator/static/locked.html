<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>{{title}}</title>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="robots" content="noindex, nofollow" />
	<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
	<style>
		:root { --bg: #1b1d22; --panel: #24272e; --fg: #e6e8ec; --muted: #9aa0ab; --accent: #3a5bd9; --bad: #e0716b; }
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
			background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
		form { width: 100%; max-width: 380px; background: var(--panel); border-radius: 10px; padding: 24px; }
		h1 { font-size: 1.25rem; margin: 0 0 4px; }
		p { margin: 0 0 16px; color: var(--muted); }
		input { width: 100%; padding: 9px 10px; border-radius: 6px; border: 1px solid #3a3f4a; background: var(--bg);
			color: var(--fg); font: inherit; }
		input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
		button { margin-top: 12px; width: 100%; padding: 9px; border: 0; border-radius: 6px; background: var(--accent);
			color: #fff; font: inherit; cursor: pointer; }
		.hint { margin: 10px 0 0; font-size: 0.9em; }
		.error { color: var(--bad); margin: 10px 0 0; min-height: 1.5em; }
	</style>
</head>
<body>
	<form id="login">
		<h1>{{title}}</h1>
		<p>Confidential. Enter the password to continue.</p>
		<label for="password" class="hint">Password</label>
		<input id="password" type="password" autocomplete="current-password" autofocus required maxlength="200" />
		<p class="hint">{{hint}}</p>
		<button type="submit">Continue</button>
		<p class="error" id="error" role="alert"></p>
	</form>
	<script>
		document.getElementById("login").addEventListener("submit", async (event) => {
			event.preventDefault();
			const error = document.getElementById("error");
			error.textContent = "";
			try {
				const res = await fetch("api/access", { method: "POST", headers: { "Content-Type": "application/json" },
					body: JSON.stringify({ password: document.getElementById("password").value }) });
				if (res.ok) { location.reload(); return; }
				const data = await res.json().catch(() => ({}));
				error.textContent = (data.detail && (data.detail.message || data.detail)) || `Login failed (${res.status}).`;
			} catch (err) {
				error.textContent = "No connection to the server.";
			}
		});
	</script>
</body>
</html>
