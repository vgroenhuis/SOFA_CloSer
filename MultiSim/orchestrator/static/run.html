<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Saved run</title>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
	<link rel="stylesheet" href="assets/style.css" />
	<style>
		html, body { height: 100%; overflow: hidden; }
		body { display: flex; flex-direction: column; }
		#bar {
			flex: 0 0 auto;
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			gap: 8px 14px;
			padding: 8px 14px;
			background: var(--surface);
			border-bottom: 1px solid var(--border);
		}
		#bar .group { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }
		#bar .spacer { flex: 1; }
		#bar h1 { font-size: 15px; }
		#details { font-size: 12px; }
		#stage { position: relative; flex: 1 1 auto; min-height: 0; }
		#frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
		.stage-overlay {
			position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
			justify-content: center; gap: 14px; text-align: center; padding: 16px; background: var(--bg);
		}
	</style>
</head>
<body>
	<div id="bar">
		<div class="group">
			<a href="./" class="button secondary small" title="Back to all simulations">&larr; All simulations</a>
			<h1 id="title">Saved run</h1>
			<span class="badge saved-run">saved run</span>
			<span id="level-badge" class="badge hidden"></span>
		</div>
		<div class="group">
			<span class="muted" id="details"></span>
		</div>
		<div class="spacer"></div>
		<div class="group">
			<button class="small" id="share-btn" title="Copy this run's link: anyone with it can play it back">Copy link</button>
			<span class="muted small" id="share-status" aria-live="polite"></span>
		</div>
	</div>
	<div id="stage">
		<iframe id="frame" title="Saved run" allow="fullscreen"></iframe>
		<div class="stage-overlay hidden" id="missing-overlay">
			<h3>No such saved run</h3>
			<p class="muted">It may have been deleted, or the link is incomplete.</p>
			<a class="button" href="./">Back to all simulations</a>
		</div>
	</div>
	<script type="module" src="assets/run.js"></script>
</body>
</html>
