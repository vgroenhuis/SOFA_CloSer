# Include inside the site's <VirtualHost>: serves MultiSim at /sofa/.
# Needs: a2enmod proxy proxy_http proxy_wstunnel rewrite headers
# and MSD_BASE_PATH=/sofa/ plus MSD_TRUST_PROXY_HEADERS=true in .env.
# For another prefix, change /sofa here and MSD_BASE_PATH together.
ProxyPreserveHost On
RequestHeader setIfEmpty X-Forwarded-Proto "http"
RewriteEngine On
RewriteRule ^/sofa$ /sofa/ [R=301,L]
# Simulations stream over WebSockets (/sofa/sim/<id>/ws/...).
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^/sofa/(.*)$ ws://127.0.0.1:8080/$1 [P,L]
ProxyPass        /sofa/ http://127.0.0.1:8080/ timeout=300
ProxyPassReverse /sofa/ http://127.0.0.1:8080/
