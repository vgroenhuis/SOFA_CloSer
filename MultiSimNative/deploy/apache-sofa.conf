# Include inside the site's <VirtualHost>: serves the app at the site root.
# Needs: a2enmod proxy proxy_http proxy_wstunnel rewrite headers
ProxyPreserveHost On
# Keep X-Forwarded-Proto from a TLS-terminating proxy in front; default to http.
RequestHeader setIfEmpty X-Forwarded-Proto "http"
# Diagnostic: remember whether the request arrived at Apache with an Upgrade header.
SetEnvIf Upgrade "(.+)" ORIG_UPGRADE=$1
RequestHeader set X-Orig-Upgrade "%{ORIG_UPGRADE}e" env=ORIG_UPGRADE
RewriteEngine On
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^/(.*)$ ws://127.0.0.1:8080/$1 [P,L]
ProxyPass        / http://127.0.0.1:8080/
ProxyPassReverse / http://127.0.0.1:8080/
ProxyTimeout 300
